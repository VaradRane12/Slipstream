server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text files before sending them
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built files have a hash in their name (index-BQgGZqL9.js), so they never change:
  # browsers can cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: React Router handles URLs like /session/9693 in the browser.
  # If no real file matches, send index.html instead of a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
